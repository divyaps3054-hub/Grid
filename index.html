<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Webpage using Flexbox</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        font-family:Arial, sans-serif;
        background:#f4f4f4;
    }

    header{
        background:#333;
        color:white;
        text-align:center;
        padding:20px;
    }

    .container{
        display:flex;
        flex-wrap:wrap;
        gap:20px;
        padding:20px;
        justify-content:center;
    }

    .card{
        background:white;
        padding:20px;
        border-radius:10px;
        box-shadow:0 2px 5px rgba(0,0,0,0.2);
        flex:1 1 300px;
        max-width:350px;
    }

    footer{
        background:#333;
        color:white;
        text-align:center;
        padding:15px;
        margin-top:20px;
    }

    @media (max-width: 768px){
        .container{
            flex-direction:column;
            align-items:center;
        }
    }
</style>
</head>

<body>

<header>
    <h1>Responsive Webpage</h1>
</header>

<div class="container">
    <div class="card">
        <h2>Section 1</h2>
        <p>This is the first content section.</p>
    </div>

    <div class="card">
        <h2>Section 2</h2>
        <p>This is the second content section.</p>
    </div>

    <div class="card">
        <h2>Section 3</h2>
        <p>This is the third content section.</p>
    </div>
</div>

<footer>
    <p>Responsive Design using Flexbox</p>
</footer>

</body>
</html>
